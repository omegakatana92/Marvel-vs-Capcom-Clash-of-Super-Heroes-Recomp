# Marvel vs. Capcom: Clash of Super Heroes (Capcom 1998, CPS-2 arcade board): per-game
# settings read by the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Marvel vs. Capcom
# What the window is called (the name stays the folder the player's settings are kept under)
title = Marvel vs. Capcom Recomp
id = mvsc
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.mvsc
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `mvsc` is MAME's parent set (Europe 980123); its clones (mvscr1, mvscu, mvscur1, mvscj, mvscjr1, mvsca,
# mvscar1, mvsch, mvscb) are built from the same board and are not accepted.
rom_set = mvsc
rom_parent = mvsc
rom_name = Marvel Vs. Capcom: Clash of Super Heroes (Europe 980123)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, eight 512 KiB files: 4 MiB). graphics: four files side by side
# per row (64-bit words), two rows of 4 MiB files (32 MiB in all): mvc.13m/15m/17m/19m, then
# mvc.14m/16m/18m/20m, and the region is populated from 0. sound_program: the Z80's ROMs (mvc.01, mvc.02).
# samples: the QSound chip's (mvc.11m, mvc.12m, 8 MiB). key: the board's cipher key.
program = mvce.03a:824e4a90 mvce.04a:436c5a4e mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26
graphics = mvc.13m:fa5f74bc mvc.15m:71938a8f mvc.17m:92741d07 mvc.19m:bcb72fc6 mvc.14m:7f1df4e4 mvc.16m:90bd3203 mvc.18m:67aaf727 mvc.20m:8b0bade8
sound_program = mvc.01:41629e95 mvc.02:963abf6b
samples = mvc.11m:850fe663 mvc.12m:7ccb1896
key = mvsc.key:7e101e09

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (eight 512 KiB ROMs), so this spans the whole program.
code_end = 400000
